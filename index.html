<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alles Gute zum Geburtstag, Felix! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        /* Die Person mit Tröte Animation */
        .party-person {
            font-size: 100px;
            animation: bounce 0.6s infinite alternate;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .party-horn {
            display: inline-block;
            transform-origin: bottom left;
            animation: blowHorn 0.3s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes blowHorn {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.3) rotate(-15deg); }
        }

        h1 {
            font-size: 3rem;
            color: #d63384;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 1.2s forwards 0.5s;
        }

        p.subtitle {
            font-size: 1.5rem;
            color: #555;
            opacity: 0;
            animation: fadeIn 1s forwards 1.5s;
            margin-bottom: 30px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Kitschiger Herzchen-Hintergrund */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.6);
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Konfetti Canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Start-Button für Musik & Party */
        .btn-party {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            opacity: 0;
            animation: fadeIn 1s forwards 2s;
            z-index: 20;
        }

        .btn-party:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <!-- Audio-Element für die Hintergrundmusik -->
    <audio id="birthday-audio" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/birthday_party.ogg" type="audio/ogg">
        Dein Browser unterstützt kein Audio.
    </audio>

    <div class="container">
        <!-- Person mit Tröte -->
        <div class="party-person">
            🥳<span class="party-horn">🎉</span>
        </div>

        <h1>Alles Gute zum Geburtstag, Felix! ❤️</h1>
        <p class="subtitle">Du bist der Beste! Auf ein weiteres tolles Jahr mit dir! 🥂✨</p>

        <button class="btn-party" onclick="startParty()">Musik & Party starten! 🎵</button>
    </div>

    <script>
        // Herzchen-Regen im Hintergrund
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);

        // Konfetti-System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function createConfetti() {
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    size: Math.random() * 8 + 4,
                    color: ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81'][Math.floor(Math.random() * 6)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4; // Schwerkraft
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(updateConfetti);
        }

        function startParty() {
            createConfetti();

            const audio = document.getElementById('birthday-audio');
            audio.play().catch(error => {
                console.log("Audio konnte nicht gestartet werden:", error);
            });

            const btn = document.querySelector('.btn-party');
            btn.innerHTML = "Party läuft! 🎈🥳";
            btn.style.backgroundColor = "#2ed573";
        }

        window.onload = () => {
            createConfetti();
            updateConfetti();
        };

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
