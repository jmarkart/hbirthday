<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alles Gute zum Geburtstag, Felix! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f72585 0%, #7209b7 50%, #3a0ca3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            text-align: center;
            position: relative;
            padding: 20px;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }

        /* Die Person mit Tröte Animation */
        .party-person {
            font-size: 85px;
            animation: bounce 0.5s infinite alternate;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .party-horn {
            display: inline-block;
            transform-origin: bottom left;
            animation: blowHorn 0.25s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes blowHorn {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.3) rotate(-15deg); }
        }

        h1 {
            font-size: 2.5rem;
            color: #7209b7;
            font-weight: 800;
            margin-bottom: 10px;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 1.2s forwards 0.5s;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: #444;
            opacity: 0;
            animation: fadeIn 1s forwards 1.2s;
            margin-bottom: 25px;
            font-weight: 500;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Buttons */
        .btn-action {
            background: linear-gradient(135deg, #f72585 0%, #b5179e 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(247, 37, 133, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            z-index: 20;
            margin-bottom: 15px;
        }

        .btn-action:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(247, 37, 133, 0.6);
        }

        /* Geschenk öffnen Button (erscheint nach 3 Sekunden) */
        #step-2 {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        #step-2.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Geschenk-Box (erst unsichtbar) */
        .gift-box {
            display: none;
            background: #f8f9fa;
            border: 3px solid #7209b7;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.8s forwards;
        }

        .gift-box h3 {
            color: #7209b7;
            margin-bottom: 10px;
            font-size: 1.5rem;
            text-align: center;
        }

        .gift-box p {
            color: #333;
            font-size: 1.05rem;
            margin-bottom: 15px;
            line-height: 1.5;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #7209b7;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }

        /* Kitschiger Herzchen-Hintergrund */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.5);
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Konfetti Canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <!-- Person mit Tröte -->
        <div class="party-person">
            🥳<span class="party-horn">🎉</span>
        </div>

        <h1>Olls Guate zum Geburtstog, Felix! 🚀</h1>
        <p class="subtitle">Du olter Sack! 🥂✨</p>

        <!-- Schritt 1: Konfetti-Party Button -->
        <div id="step-1">
            <button class="btn-action" onclick="startParty()">🎉 Konfetti-Party starten!</button>
        </div>

        <!-- Schritt 2: Geschenk öffnen Button (erscheint nach 3 Sekunden) -->
        <div id="step-2">
            <button class="btn-action" style="background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);" onclick="revealGift()">🎁 Do dein Geschenk öffnen!</button>
        </div>

        <!-- Das eigentliche Geschenk (erscheint nach Klick auf den zweiten Button) -->
        <div id="gift-section" class="gift-box">
            <h3>🏔️ Dein Geburtstagsgeschenk!🏔️</h3>
            <p>Weil mir über <b>Silvester in Südtirol</b> sein, gibts a <b>romantisches Mittagessen im Gasthof Jäger in Sirmian!</b> 🥰🍽️<br><br>Suach dir direkt dein Lieblingstermin aus:</p>
            
            <div class="form-group">
                <label for="wunsch-datum">Wunschtermin:</label>
                <input type="date" id="wunsch-datum">
            </div>

            <button class="btn-submit" onclick="sendVoucher()">Termin per WhatsApp senden! 💌</button>
        </div>
    </div>

    <script>
        // Herzchen-Regen im Hintergrund
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);

        // Konfetti-System (10.000 Partikel)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function createConfetti() {
            particles = [];
            for (let i = 0; i < 10000; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 35,
                    vy: (Math.random() - 0.5) * 35 - 10,
                    size: Math.random() * 8 + 4,
                    color: ['#f72585', '#7209b7', '#3a0ca3', '#4cc9f0', '#ff9e00', '#ff0054', '#00f5d4'][Math.floor(Math.random() * 7)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 20
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4; // Schwerkraft
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(updateConfetti);
        }

        let hasClickedOnce = false;

        // Party starten / Konfetti schmeißen (jederzeit wiederholbar)
        function startParty() {
            createConfetti();

            // Beim ersten Klick nach genau 3 Sekunden den zweiten Button einblenden
            if (!hasClickedOnce) {
                hasClickedOnce = true;
                setTimeout(() => {
                    document.getElementById('step-2').classList.add('show');
                }, 3000); // 3 Sekunden Verzögerung
            }
        }

        // Das Geschenk aufdecken
        function revealGift() {
            createConfetti(); // Noch eine fette Extrarunde Konfetti beim Öffnen!
            document.getElementById('gift-section').style.display = 'block';
        }

        // WhatsApp Nachricht generieren
        function sendVoucher() {
            const datum = document.getElementById('wunsch-datum').value;
            
            if (!datum) {
                alert("Bitte wähle zuerst ein Datum aus! 😊");
                return;
            }

            const deineHandynummer = "3398683172"; 
            
            const nachricht = encodeURIComponent(`Hoi! Ich honn mir a Termin für mein Geburtstogsgeschenk ausgsuacht. Mein Wunschtermin fürs das Mittogessen im Gasthof Jäger in Sirmian isch der ${datum}!`);
            
            const whatsappUrl = `https://wa.me/${deineHandynummer}?text=${nachricht}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = () => {
            updateConfetti();
        };

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
